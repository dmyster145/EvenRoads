<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/hoppyroads-icon.png" />
    <link rel="apple-touch-icon" href="/hoppyroads-icon.png" />
    <title>HoppyRoads</title>
  </head>
  <body>
    <div id="app" aria-hidden="true"></div>
    <div id="status" aria-hidden="true"></div>
    <div id="companion-root"></div>

    <div id="perf-console-panel" data-collapsed="false" aria-live="polite">
      <div id="perf-console-header">
        <span id="perf-console-title">Perf Console</span>
        <button id="perf-console-toggle" type="button">Hide</button>
        <button id="perf-console-clear" type="button">Clear</button>
        <button id="perf-console-copy" type="button">Copy All</button>
        <button id="perf-console-record" type="button">Stop</button>
      </div>
      <pre id="perf-console-output"></pre>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
