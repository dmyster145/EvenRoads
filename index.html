<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/hoppyroads-icon.png" />
    <link rel="apple-touch-icon" href="/hoppyroads-icon.png" />
    <title>HoppyRoads</title>
  </head>
  <body>
    <div id="app" aria-hidden="true"></div>
    <div id="status" aria-hidden="true"></div>
    <div id="companion-root"></div>

    <div id="app-version" style="position:fixed;bottom:8px;left:0;width:100%;text-align:center;color:#000;font-size:11px;pointer-events:none;"></div>

    <div id="perf-console-panel" data-collapsed="false" aria-live="polite">
      <div id="perf-console-header">
        <span id="perf-console-title">Perf Console</span>
        <button id="perf-console-toggle" type="button">Hide</button>
        <button id="perf-console-clear" type="button">Clear</button>
        <button id="perf-console-copy" type="button">Copy All</button>
        <button id="perf-console-record" type="button">Stop</button>
      </div>
      <pre id="perf-console-output"></pre>
    </div>

    <script type="module" src="/src/main.ts"></script>
    <script type="module">
      document.getElementById('app-version').textContent = 'v' + __APP_VERSION__;
    </script>
  </body>
</html>
